name: Repair Secret Burrito asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-secret-burrito.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified WebP
        shell: bash
        run: |
          set -euo pipefail
          cat             .asset-staging/burrito.part00             .asset-staging/burrito.part01             .asset-staging/burrito.part02             .asset-staging/burrito.part03             .asset-staging/burrito.part04a             .asset-staging/burrito.part04b             .asset-staging/burrito.part05             | tr -d '\r\n ' | base64 -d > assets/bite_secret_burrito.webp
          echo "958b7bdc173e979bc5ab9bb5af1e014a831667228f2a2011cce5dec1c0dd88d8  assets/bite_secret_burrito.webp" | sha256sum -c -
          test "$(stat -c %s assets/bite_secret_burrito.webp)" = "31394"

      - name: Commit repaired binary and clean staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-staging
          rm -f .github/workflows/repair-secret-burrito.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Secret Burrito image asset"
          git push
