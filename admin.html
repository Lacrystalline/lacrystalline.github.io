<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店長後台｜水晶庭 La Crystalline</title>
<link rel="icon" type="image/png" href="assets/emblem_nav.png">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#090d14;--panel:#111a2b;--panel2:#0d1420;--crys:#7fd3d6;--crys2:#4a8f95;--gold:#d8b87a;--mist:#e8edf2;--mute:#9aa7b4;--line:rgba(127,211,214,.18);--danger:#d87a8f;--ok:#9ed59e;--serif:"Cormorant Garamond",serif;--tc:"Noto Serif TC",serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 650px at 85% -5%,rgba(50,90,130,.25),transparent 60%),linear-gradient(180deg,#070b12,#0a1120 48%,#080d16);color:var(--mist);font-family:var(--tc);font-weight:300;min-height:100vh}
button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 22px;background:rgba(8,12,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;color:var(--mist);text-decoration:none}.brand img{height:28px}.brand span{font-family:var(--serif);letter-spacing:.12em}.brand small{display:block;color:var(--crys2);font-family:var(--tc);font-size:.58rem;letter-spacing:.24em}.top-actions{display:flex;gap:9px;align-items:center}.ghost,.primary,.danger{border:1px solid var(--line);border-radius:3px;padding:9px 13px;cursor:pointer;background:transparent;color:var(--mist)}.ghost:hover{border-color:var(--crys2);color:var(--crys)}.primary{background:linear-gradient(135deg,var(--crys),var(--crys2));border:none;color:#06121a;font-weight:600}.danger{border-color:rgba(216,122,143,.45);color:#efb0bd}.danger:hover{background:rgba(216,122,143,.08)}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 70px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.ey{font-family:var(--serif);font-style:italic;color:var(--crys);font-size:1.02rem}.hero h1{font-family:var(--serif);font-size:clamp(2rem,5vw,3rem);font-weight:500;letter-spacing:.08em;margin:.1em 0}.sub{color:var(--mute);font-size:.9rem}.session{color:var(--mute);font-size:.78rem;text-align:right;max-width:340px;overflow-wrap:anywhere}
.card{background:rgba(17,26,43,.55);border:1px solid var(--line);border-radius:5px;padding:18px}.login{max-width:460px;margin:11vh auto 0}.login h2{font-family:var(--serif);font-size:1.7rem;font-weight:500;margin:0 0 8px}.login p{color:var(--mute);font-size:.88rem;line-height:1.8}.field{margin:13px 0}.field label{display:block;color:var(--crys);font-size:.78rem;letter-spacing:.09em;margin-bottom:6px}.field input,.toolbar input,.toolbar select{width:100%;background:rgba(13,20,32,.9);border:1px solid var(--line);border-radius:3px;color:var(--mist);padding:10px 12px;outline:none}.field input:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--crys2)}.login .primary{width:100%;margin-top:8px;padding:11px}.msg{min-height:1.5em;color:var(--danger);font-size:.83rem;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.stat{padding:14px 16px;background:rgba(17,26,43,.45);border:1px solid var(--line);border-radius:4px}.stat .k{color:var(--mute);font-size:.75rem;letter-spacing:.08em}.stat .v{font-family:var(--serif);font-size:1.8rem;color:var(--crys);margin-top:2px}.toolbar{display:grid;grid-template-columns:1.5fr .8fr auto;gap:10px;margin-bottom:14px}.toolbar button{white-space:nowrap}
.orders{display:grid;gap:12px}.order{background:rgba(17,26,43,.48);border:1px solid var(--line);border-radius:5px;overflow:hidden}.order.new{border-left:3px solid var(--crys)}.order.confirmed{border-left:3px solid var(--gold)}.order.completed{border-left:3px solid var(--ok)}.order.cancelled{border-left:3px solid var(--danger)}.oh{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}.code{font-family:var(--serif);letter-spacing:.13em;color:var(--crys);font-size:1.12rem}.who{font-size:.9rem}.who small{display:block;color:var(--mute);margin-top:2px}.time{color:var(--mute);font-size:.76rem;text-align:right}.status{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}.status.new{color:var(--crys)}.status.confirmed{color:var(--gold)}.status.completed{color:var(--ok)}.status.cancelled{color:#efb0bd}.body{display:none;border-top:1px solid var(--line);padding:15px 16px 17px;background:rgba(8,13,22,.22)}.order.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.block{border:1px solid rgba(127,211,214,.1);padding:11px 12px;border-radius:3px}.block h3{font-size:.74rem;color:var(--crys2);letter-spacing:.11em;font-weight:500;margin:0 0 7px}.block p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.list{margin:0;padding-left:18px}.list li{margin:3px 0}.money{font-family:var(--serif);color:var(--gold);font-size:1.25rem}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.actions button,.actions select{background:rgba(13,20,32,.85);border:1px solid var(--line);color:var(--mist);border-radius:3px;padding:8px 10px}.actions select{min-width:145px}.empty{text-align:center;color:var(--mute);padding:48px 15px;border:1px dashed var(--line);border-radius:5px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#111a2b;border:1px solid var(--crys2);padding:12px 15px;border-radius:4px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:none}.toast.err{border-color:var(--danger)}
@media(max-width:760px){.wrap{padding:24px 14px 60px}.top{padding:11px 14px}.brand span{display:none}.hero{align-items:start;flex-direction:column}.session{text-align:left}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.oh{grid-template-columns:1fr auto}.who{grid-column:1/2}.time{grid-column:1/2;text-align:left}.status{grid-column:2/3;grid-row:1/2}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="top">
  <a class="brand" href="index.html"><img src="assets/emblem_nav.png" alt="水晶庭"><span>La Crystalline<small>店長後台</small></span></a>
  <div class="top-actions">
    <a class="ghost" href="order.html" style="text-decoration:none">前台點餐</a>
    <button class="ghost hidden" id="logoutBtn">登出</button>
  </div>
</nav>

<main class="wrap">
  <section id="loginView" class="card login">
    <div class="ey">Keeper Only</div>
    <h2>店長登入</h2>
    <p>使用 Supabase Authentication 建立的店長帳號登入。此頁不使用 service_role key，公開訪客無法讀取訂單。</p>
    <div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="keeper@example.com"></div>
    <div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button id="loginBtn" class="primary">登入後台</button>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="hero">
      <div><div class="ey">Order Ledger</div><h1>店長訂單簿</h1><div class="sub">查看、篩選並更新水晶庭指名・點餐訂單。</div></div>
      <div id="sessionInfo" class="session"></div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">全部</div><div class="v" id="sAll">0</div></div>
      <div class="stat"><div class="k">新訂單</div><div class="v" id="sNew">0</div></div>
      <div class="stat"><div class="k">已確認</div><div class="v" id="sConfirmed">0</div></div>
      <div class="stat"><div class="k">已完成</div><div class="v" id="sCompleted">0</div></div>
    </div>

    <div class="toolbar">
      <input id="search" placeholder="搜尋取件碼、旅者名稱、伺服器、指名…">
      <select id="filterStatus"><option value="">全部狀態</option><option value="new">新訂單</option><option value="confirmed">已確認</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select>
      <button id="refreshBtn" class="ghost">重新整理</button>
    </div>

    <div id="orders" class="orders"></div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://idqysanzhafayovieqig.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h-0u9bNzU_cqyVah3QTmKg_pIScFn5T";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let allOrders=[];
const fmt = n => Number(n||0).toLocaleString('en-US');
const esc = s => String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const statusText={new:'新訂單',confirmed:'已確認',completed:'已完成',cancelled:'已取消'};
function showToast(msg,err=false){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2600)}
function localTime(iso){if(!iso)return '';return new Date(iso).toLocaleString('zh-TW',{hour12:false})}
function detailList(arr,type){if(!Array.isArray(arr)||!arr.length)return '<span style="color:var(--mute)">無</span>';return '<ul class="list">'+arr.map(x=>type==='item'?`<li>${esc(x.name)} × ${esc(x.qty)} <span style="color:var(--mute)">(${fmt(x.price)} Gil)</span></li>`:`<li>${esc(x.name)}${x.price==null?' <span style="color:var(--gold)">時價</span>':` <span style="color:var(--mute)">(${fmt(x.price)} Gil)</span>`}</li>`).join('')+'</ul>'}
async function signIn(){
  $('loginMsg').textContent='';$('loginBtn').disabled=true;$('loginBtn').textContent='登入中…';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('loginBtn').disabled=false;$('loginBtn').textContent='登入後台';
  if(error){$('loginMsg').textContent='登入失敗：'+error.message;return}
  await syncSession();
}
async function signOut(){await sb.auth.signOut();await syncSession()}
async function syncSession(){
  const {data:{session}}=await sb.auth.getSession();
  const on=!!session;
  $('loginView').classList.toggle('hidden',on);$('adminView').classList.toggle('hidden',!on);$('logoutBtn').classList.toggle('hidden',!on);
  if(on){$('sessionInfo').textContent='已登入：'+session.user.email;await loadOrders();subscribeRealtime()}else{$('sessionInfo').textContent='';allOrders=[];unsubscribeRealtime()}
}
async function loadOrders(){
  $('orders').innerHTML='<div class="empty">讀取訂單中…</div>';
  const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(error){$('orders').innerHTML='<div class="empty">無法讀取訂單：'+esc(error.message)+'</div>';showToast('讀取失敗',true);return}
  allOrders=data||[];render();
}
function render(){
  const q=$('search').value.trim().toLowerCase(), fs=$('filterStatus').value;
  const rows=allOrders.filter(o=>{
    const hay=[o.code,o.guest_name,o.server,o.host,o.note].filter(Boolean).join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!fs||(o.status||'new')===fs);
  });
  $('sAll').textContent=allOrders.length;$('sNew').textContent=allOrders.filter(o=>(o.status||'new')==='new').length;$('sConfirmed').textContent=allOrders.filter(o=>o.status==='confirmed').length;$('sCompleted').textContent=allOrders.filter(o=>o.status==='completed').length;
  if(!rows.length){$('orders').innerHTML='<div class="empty">目前沒有符合條件的訂單。</div>';return}
  $('orders').innerHTML=rows.map(o=>{const st=o.status||'new';return `<article class="order ${esc(st)}" data-id="${o.id}">
    <div class="oh" data-toggle>
      <div class="code">${esc(o.code)}</div>
      <div class="who">${esc(o.guest_name)}<small>${esc(o.server)}${o.host?' ・ 指名 '+esc(o.host):''}</small></div>
      <div class="time">${esc(localTime(o.created_at))}<br><span class="money">${fmt(o.total)} Gil</span></div>
      <div class="status ${esc(st)}">${statusText[st]||esc(st)}</div>
    </div>
    <div class="body">
      <div class="grid">
        <div class="block"><h3>特殊服務</h3>${detailList(o.services,'service')}</div>
        <div class="block"><h3>點餐內容</h3>${detailList(o.items,'item')}</div>
        <div class="block"><h3>備註</h3><p>${o.note?esc(o.note):'<span style="color:var(--mute)">無</span>'}</p></div>
        <div class="block"><h3>訂單資訊</h3><p>取件碼：${esc(o.code)}<br>旅者：${esc(o.guest_name)} / ${esc(o.server)}<br>指名：${esc(o.host||'無')}<br>合計：<span class="money">${fmt(o.total)} Gil</span></p></div>
      </div>
      <div class="actions">
        <select data-status><option value="new" ${st==='new'?'selected':''}>新訂單</option><option value="confirmed" ${st==='confirmed'?'selected':''}>已確認</option><option value="completed" ${st==='completed'?'selected':''}>已完成</option><option value="cancelled" ${st==='cancelled'?'selected':''}>已取消</option></select>
        <button data-copy>複製取件碼</button>
        <button data-delete class="danger">刪除訂單</button>
      </div>
    </div>
  </article>`}).join('');
  document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>x.closest('.order').classList.toggle('open'));
  document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>setStatus(x.closest('.order').dataset.id,x.value));
  document.querySelectorAll('[data-copy]').forEach(x=>x.onclick=async()=>{const id=x.closest('.order').dataset.id,o=allOrders.find(a=>String(a.id)===String(id));await navigator.clipboard.writeText(o.code);showToast('已複製 '+o.code)});
  document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>removeOrder(x.closest('.order').dataset.id));
}
async function setStatus(id,status){const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error){showToast('狀態更新失敗：'+error.message,true);return}const o=allOrders.find(a=>String(a.id)===String(id));if(o)o.status=status;render();showToast('狀態已更新')}
async function removeOrder(id){const o=allOrders.find(a=>String(a.id)===String(id));if(!confirm(`確定刪除訂單 ${o?.code||id}？此動作無法復原。`))return;const {error}=await sb.from('orders').delete().eq('id',id);if(error){showToast('刪除失敗：'+error.message,true);return}allOrders=allOrders.filter(a=>String(a.id)!==String(id));render();showToast('訂單已刪除')}
$('loginBtn').onclick=signIn;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});$('logoutBtn').onclick=signOut;$('refreshBtn').onclick=loadOrders;$('search').oninput=render;$('filterStatus').onchange=render;
let rtChannel=null;
function subscribeRealtime(){
  if(rtChannel) return;
  try{
    rtChannel=sb.channel('orders-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'orders'},payload=>{
        // reload quietly on any insert/update/delete
        loadOrders();
        if(payload.eventType==='INSERT'){ showToast('有新訂單進來了'); }
      })
      .subscribe();
  }catch(e){ console.warn('realtime 訂閱失敗',e); }
}
function unsubscribeRealtime(){ if(rtChannel){ sb.removeChannel(rtChannel); rtChannel=null; } }
sb.auth.onAuthStateChange(()=>syncSession());syncSession();
</script>
</body>
</html>
